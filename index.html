<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>24 kleine Auszeiten</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#294b40;font:17px/1.55 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}header{text-align:center;padding:22px 0}h1{font:clamp(2rem,6vw,3.5rem) Georgia,serif;margin:10px 0}h2{font-size:1.25rem} .ornament{font-size:2rem;letter-spacing:.5em} .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.door{aspect-ratio:1;border:1px solid #9aa99b;border-radius:12px;background:#dce7db;color:#294b40;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;cursor:pointer;transition:transform .2s}.door:nth-child(3n){background:#ead9cd}.door:nth-child(3n+1){background:#e9e1cc}.door strong{font:2rem Georgia,serif}.door small{font-size:.75rem}.door.open{border:2px solid #456e54}.door:hover{transform:translateY(-3px)}button:focus-visible,a:focus-visible{outline:3px solid #254f92;outline-offset:4px}a.action,button.action{display:inline-block;background:#345e49;color:white;padding:12px 18px;border-radius:8px;border:0;font:inherit;text-decoration:none;cursor:pointer}.panel{background:#fffdf8;border:1px solid #b8c4b7;border-radius:12px;padding:20px;margin:16px 0}dialog{max-width:460px;width:90%;border:1px solid #879d8c;border-radius:16px;padding:24px;color:#294b40;background:#fffdf8}dialog::backdrop{background:#172d27aa}footer{text-align:center;margin:24px 0;font-size:.85rem} .muted{font-size:.9rem} @media(max-width:600px){.grid{grid-template-columns:repeat(4,1fr);gap:8px}main{padding:16px}.door strong{font-size:1.6rem}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><div class="ornament" aria-hidden="true">✧ ❄ ✧</div><h1 id="title"></h1><p id="subtitle"></p></header><section id="content"></section><footer>Eine kleine Auszeit im Advent.</footer></main><dialog id="modal" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="message"></div><form method="dialog"><button class="action" style="margin-top:16px">Schließen</button></form></dialog><script src="config.js"></script><script>
const c=window.CONFIG, content=document.getElementById('content'), modal=document.getElementById('modal');
document.getElementById('title').textContent=c.title;document.getElementById('subtitle').textContent=c.subtitle;
const params=new URLSearchParams(location.search), edit=params.get('gestalten'), preview=params.get('vorschau')==='1';
function el(tag,txt,cls){const e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;return e;}
function link(day,label){const url=c.links[day];if(!url)return el('p','Der Teams-Link wurde noch nicht hinterlegt.','muted');try{const u=new URL(url);if(u.protocol!=='https:')throw Error();const a=el('a',label,'action');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a;}catch{return el('p','Der Teams-Link ist ungültig.');}}
function unlocked(day){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return Number(p.year)*10000+Number(p.month)*100+Number(p.day)>=c.year*10000+1200+day;}
if(edit){content.append(el('h2','Deine Türchen'));const days=Object.hasOwn(c.assignments,edit)?c.assignments[edit]:null;if(!days){content.append(el('p','Dieser Gestaltungslink ist unbekannt.'));}else{content.append(el('p','Gestalte deinen Kartenimpuls im passenden Medium. Lade deine Dateien im jeweiligen Teams-Ordner hoch.'));for(const d of days){const p=el('div','','panel');p.append(el('h2',d+'. Dezember'),link(d,'In Teams gestalten'));content.append(p);}}const back=el('a','Zum Adventskalender');back.href=location.pathname;content.append(back);}else{if(preview)content.append(el('p','Vorschaumodus – alle Türchen sind zum Testen geöffnet.','panel'));else content.append(el('p','Jeden Tag wartet ein neuer Impuls auf dich. Bereits geöffnete Türchen bleiben zugänglich.'));const grid=el('div','','grid');for(const d of [7,19,2,13,24,4,15,9,1,21,11,6,17,3,23,10,5,20,12,16,22,8,18,14]){const b=el('button','','door');const open=preview||unlocked(d);if(open)b.classList.add('open');b.append(el('strong',String(d)),el('small',open?'Öffnen':'✧'));b.setAttribute('aria-label',d+'. Dezember – '+(open?'öffnen':'noch geschlossen'));b.onclick=()=>{document.getElementById('modalTitle').textContent=d+'. Dezember';const m=document.getElementById('message');m.replaceChildren();if(preview||unlocked(d)){m.append(el('p','Dein heutiger Adventsimpuls wartet in Teams.'),link(d,'Adventsimpuls öffnen'));}else m.append(el('p','Dieses Türchen öffnet sich am '+d+'. Dezember '+c.year+'.'));modal.showModal();};grid.append(b);}content.append(grid);}
</script></body></html>
